# golangci-lint configuration for Velocity.
#
# Enforces two framework conventions:
#
#   1. Error-string prefix (sweep/error-wrap-shutdown): every fmt.Errorf /
#      errors.New message must begin with "velocity/<pkg>: " and be
#      lowercase. See docs/security-guidelines.md and CLAUDE.md.
#
#   2. Panic-safe goroutines (sweep/panic-recovery): every goroutine
#      spawned from library code must go through `async.Go` or include an
#      explicit `defer recover()` that dispatches a `<pkg>.OperationFailed`
#      event or logs via the manager's logger. See CONTRIBUTING.md
#      ("Goroutines and panic recovery").

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - forbidigo
    - govet
    - gofmt
    - staticcheck

linters-settings:
  forbidigo:
    forbid:
      # Error strings must use the velocity/<pkg>: lowercase format.
      - p: 'fmt\.Errorf\("(?!velocity/)[a-zA-Z]'
        msg: 'error strings must use fmt.Errorf("velocity/<pkg>: lowercase msg: %w", err)'
      - p: 'errors\.New\("(?!velocity/)[a-zA-Z]'
        msg: 'error sentinels must use errors.New("velocity/<pkg>: lowercase msg")'
      # Raw `go func(` goroutines bypass panic recovery.
      # Matches the statement regardless of leading indentation, since Go
      # code always indents goroutine sites inside a function body. The
      # earlier `^go func\(` pattern (without \s*) matched nothing in real
      # source — see the P0 re-review note.
      - p: '(?m)^\s*go func\('
        msg: "use async.Go or an explicit defer recover() — see CONTRIBUTING.md 'Goroutines and panic recovery'"
    analyze-types: false
    exclude-godoc-examples: true

issues:
  exclude-rules:
    # validation/ surfaces user-facing messages, not framework errors.
    - path: ^validation/
      linters:
        - forbidigo
    # Tests: descriptive error strings + free goroutine use are fine.
    - path: _test\.go
      linters:
        - forbidigo
    # async/ is the canonical panic-safe implementation — its internals
    # legitimately use `go func(` to implement async.Go, async.Run, etc.
    - path: ^async/
      linters:
        - forbidigo
    # router/event_dispatcher.go wraps listener invocation with
    # safeInvokeListener (see that file for the recovery logic).
    - path: ^router/event_dispatcher\.go
      linters:
        - forbidigo
  max-issues-per-linter: 0
  max-same-issues: 0
