# Validation rules return user-facing error messages that are surfaced
# directly to API clients and form UIs — they are terminal errors, not
# wrapped by callers via fmt.Errorf("context: %w", err). Capitalization
# and terminal periods (e.g., "The email field is required.") are a
# product decision, not a Go-idiom violation.
#
# ST1005's rationale (don't capitalize / don't end with punctuation)
# targets composable internal errors; it does not apply to this tree.
# The rule stays enabled in every other package.
#
# This config is inherited by validation/rules/ and deeper subpackages.
checks = ["inherit", "-ST1005"]
