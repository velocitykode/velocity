# staticcheck configuration for Velocity.
#
# SA1019 (use of deprecated identifier) is muted globally for the v0.x
# line. Rationale: the framework's Ctx-suffix promotion (see CHANGELOG
# "1.0 readiness: BREAKING for implementers") deprecated the non-Ctx
# methods on auth.UserStore, cache.Store, broadcast.Driver,
# storage.Driver, and queue.Driver, AND keeps them as backward-compat
# shims that delegate to context.Background(). The shims are part of
# the v0.x public API contract; calling them is intentional, not a
# bug. SA1019 here is noise that fires on every legitimate v0.x caller
# (including framework-internal tests of the shim path).
#
# At v2.0 the shims are scheduled for removal; re-enable SA1019 then so
# the cleanup is enforced.
#
# Format reference: https://staticcheck.io/docs/configuration/
checks = ["inherit", "-SA1019"]
