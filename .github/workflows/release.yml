name: Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VELOCITY_TOKEN }}

      - name: Check if release needed
        id: check
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -q "^Bump version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate version
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          # Ensure all tags are fetched
          git fetch --tags --force

          # Get highest semver tag (not just reachable from HEAD)
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          # Get commits since last tag
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          # Parse version (remove v prefix)
          VERSION=${LAST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          # Determine bump type
          HAS_BREAKING=false
          HAS_FEAT=false

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE "BREAKING|!:"; then
              HAS_BREAKING=true
            fi
            if echo "$msg" | grep -qiE "^feat|^add"; then
              HAS_FEAT=true
            fi
          done <<< "$COMMITS"

          # Calculate new version
          if [ "$HAS_BREAKING" = true ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$HAS_FEAT" = true ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping version: $LAST_TAG -> v$NEW"

      - name: Set up Go
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: go test ./... -short

      - name: Commit and tag
        if: steps.check.outputs.skip == 'false'
        id: tag
        run: |
          NEW_VERSION=${{ steps.version.outputs.new }}

          # Check if tag already exists
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists, skipping"
            echo "created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
          echo "created=true" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false' && steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          generate_release_notes: true

      - name: Notify Go Module Proxy
        if: steps.check.outputs.skip == 'false' && steps.tag.outputs.created == 'true'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          curl -sf "https://proxy.golang.org/github.com/velocitykode/velocity/@v/${VERSION}.info" || true
          echo "Go module proxy notified for ${VERSION}"

      - name: Update velocity-template
        if: steps.check.outputs.skip == 'false' && steps.tag.outputs.created == 'true'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          git clone https://x-access-token:${{ secrets.VELOCITY_TOKEN }}@github.com/velocitykode/velocity-template.git
          cd velocity-template

          # Update velocity version in go.mod
          sed -i "s|github.com/velocitykode/velocity v[0-9.]*|github.com/velocitykode/velocity ${VERSION}|" go.mod

          if git diff --quiet go.mod; then
            echo "No changes to go.mod"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add go.mod
            git commit -m "chore: update velocity to ${VERSION}"
            git push
          fi

      - name: Update vel dependency
        if: steps.check.outputs.skip == 'false' && steps.tag.outputs.created == 'true'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          git clone https://x-access-token:${{ secrets.VELOCITY_TOKEN }}@github.com/velocitykode/vel.git
          cd vel

          # Update velocity version in go.mod
          sed -i "s|github.com/velocitykode/velocity v[0-9.]*|github.com/velocitykode/velocity ${VERSION}|" go.mod

          if git diff --quiet go.mod; then
            echo "No changes to go.mod"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add go.mod
            git commit -m "chore: update velocity framework to ${VERSION}"
            git push
          fi

      - name: Update velocity-installer fallback
        if: steps.check.outputs.skip == 'false' && steps.tag.outputs.created == 'true'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          git clone https://x-access-token:${{ secrets.VELOCITY_TOKEN }}@github.com/velocitykode/velocity-installer.git
          cd velocity-installer

          # Update fallback version
          sed -i "s|fallbackVelocityVersion = \"v[0-9.]*\"|fallbackVelocityVersion = \"${VERSION}\"|" internal/generator/project.go
          sed -i "s|velocity@v[0-9.]*\"|velocity@${VERSION}\"|" internal/generator/project.go

          if git diff --quiet; then
            echo "No changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: update velocity framework to ${VERSION}"
            git push
          fi
