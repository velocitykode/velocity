name: CI

# Single pipeline for correctness gates + release automation.
# On push/PR: go vet, staticcheck, -race tests, router benchmarks, govulncheck.
# On push-to-main: if all correctness gates pass, auto-version/tag/release
# and propagate to the template and installer repos.
# On weekly schedule: govulncheck only (new CVEs in existing deps).

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday — govulncheck against current deps

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  race-tests:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests with race detector
        run: go test -race -timeout 10m ./...

  benchmarks:
    name: router benchmarks (smoke)
    runs-on: ubuntu-latest
    # Skip on the weekly cron — benchmarks against an unchanged tree
    # produce no new signal. Smoke only: ensures benchmarks still
    # compile and run. A benchstat-based regression gate (compare PR
    # HEAD vs main baseline) remains a follow-up.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run router benchmarks
        run: |
          go test -run='^$' -bench='BenchmarkRouter_(StaticHit|DynamicHit|MissFallback)' \
            -benchtime=5000x -benchmem ./router/

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  release:
    name: auto-release
    # Release only on direct push to main. PRs and the weekly cron
    # don't publish anything.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [vet, staticcheck, race-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VELOCITY_TOKEN }}

      - name: Check if release needed
        id: check
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -q "^Bump version"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate version
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          # Get highest semver tag (not nearest ancestor)
          LAST_TAG=$(git tag --sort=-v:refname | head -1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          # Get commits since last tag
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          # Parse version (remove v prefix)
          VERSION=${LAST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          # Determine bump type
          HAS_BREAKING=false
          HAS_FEAT=false

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE "BREAKING|!:"; then
              HAS_BREAKING=true
            fi
            if echo "$msg" | grep -qiE "^feat|^add"; then
              HAS_FEAT=true
            fi
          done <<< "$COMMITS"

          # Calculate new version
          if [ "$HAS_BREAKING" = true ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$HAS_FEAT" = true ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping version: $LAST_TAG -> v$NEW"

      - name: Set up Go
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Auto-format
        if: steps.check.outputs.skip == 'false'
        run: |
          gofmt -w .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format with gofmt"
          fi

      - name: Commit and tag
        if: steps.check.outputs.skip == 'false'
        run: |
          NEW_VERSION=${{ steps.version.outputs.new }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          generate_release_notes: true

      - name: Notify Go Module Proxy
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          curl -sf "https://proxy.golang.org/github.com/velocitykode/velocity/@v/${VERSION}.info" || true
          echo "Go module proxy notified for ${VERSION}"

      - name: Update velocity-template
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          git clone https://x-access-token:${{ secrets.VELOCITY_TOKEN }}@github.com/velocitykode/velocity-template.git
          cd velocity-template

          # Update velocity version in go.mod
          sed -i "s|github.com/velocitykode/velocity v[0-9.]*|github.com/velocitykode/velocity ${VERSION}|" go.mod

          if git diff --quiet go.mod; then
            echo "No changes to go.mod"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add go.mod
            git commit -m "chore: update velocity to ${VERSION}"
            git push
          fi

      - name: Update velocity-template-api
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION=v${{ steps.version.outputs.new }}
          git clone https://x-access-token:${{ secrets.VELOCITY_TOKEN }}@github.com/velocitykode/velocity-template-api.git
          cd velocity-template-api

          # Update velocity version in go.mod
          sed -i "s|github.com/velocitykode/velocity v[0-9.]*|github.com/velocitykode/velocity ${VERSION}|" go.mod

          if git diff --quiet go.mod; then
            echo "No changes to go.mod"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add go.mod
            git commit -m "chore: update velocity to ${VERSION}"
            git push
          fi

      - name: Trigger velocity-installer release
        if: steps.check.outputs.skip == 'false'
        run: |
          gh workflow run ci.yml --repo velocitykode/velocity-installer
        env:
          GH_TOKEN: ${{ secrets.VELOCITY_TOKEN }}
